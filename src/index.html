<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tic-Tac Mini Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen">
      <div class="welcome-content">
        <button id="settings-btn-welcome" class="btn-secondary">⚙️</button>
        <h1 class="title-gradient">The Tic-Tac Mini Game</h1>
        <p class="subtitle">Win the games within the game</p>
        <div class="header-buttons" style="justify-content: center; gap: 10px; margin-bottom: 14px;">
      <!-- Old settings spot -->
        </div>
        <div class="setup-section">
          <div class="form-group">
            <label for="player-count">Number of Players</label>
            <div class="button-group">
              <button class="player-btn" data-players="1">1 Player (vs CPU)</button>
              <button class="player-btn" data-players="2">2 Players</button>
            </div>
          </div>

          <div class="form-group">
            <label for="board-size">Board Size</label>
            <div class="button-group">
              <button class="size-btn" data-size="3">3×3</button>
              <button class="size-btn" data-size="4">4×4</button>
              <button class="size-btn" data-size="5">5×5</button>
            </div>
          </div>

          <div class="form-group">
            <label for="difficulty">Difficulty Level</label>
            <div class="button-group">
              <button class="difficulty-btn" data-difficulty="1">Easy</button>
              <button class="difficulty-btn" data-difficulty="2">Medium</button>
              <button class="difficulty-btn" data-difficulty="3">Hard</button>
              <button class="difficulty-btn" data-difficulty="4">Implausible</button>
            </div>
          </div>

          <div class="form-group">
            <label for="player-name">Player 1 Name</label>
            <input type="text" id="player-name" placeholder="Enter your name" value="Player 1">
          </div>

          <div class="form-group" id="player-name-2-group" style="display: none;">
            <label for="player-name-2">Player 2 Name</label>
            <input type="text" id="player-name-2" placeholder="Enter player 2 name" value="Player 2">
          </div>

          <button id="start-game-btn" class="btn-primary btn-large">Start Game</button>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
      <div class="game-header">
        <div class="score-display">
          <span class="player-info">
            <span class="current-symbol" id="current-symbol-display"></span>
            <span id="current-player-display"></span>'s Turn
          </span>
          <div class="score-board">
            <div class="score-item">
              <span id="player-x-name">X</span>: <span id="player-x-score">0</span>
            </div>
            <div class="score-item">
              <span id="player-o-name">O</span>: <span id="player-o-score">0</span>
            </div>
          </div>
        </div>
        <div class="header-buttons">
          <button id="settings-btn" class="btn-secondary">⚙️ Settings</button>
          <button id="quit-btn" class="btn-secondary">Quit Game</button>
        </div>
      </div>

      <div class="game-board-container">
        <div class="game-board" id="game-board"></div>
      </div>

      <div class="game-info">
        <p id="game-status-text">Waiting for move...</p>
      </div>
    </div>

    <!-- Mini Game Screen -->
    <div id="mini-game-screen" class="screen hidden">
      <div class="mini-game-header">
        <button id="back-from-minigame" class="btn-secondary">Forfeit</button>
        <h2 id="mini-game-title">Mini Game</h2>
        <div id="mini-game-info"></div>
      </div>

      <!-- TicTacToe Mini Game -->
      <div id="minigame-tictactoe" class="mini-game hidden">
        <div class="mini-board" id="mini-board-tictactoe"></div>
      </div>

      <!-- Wordle Mini Game -->
      <div id="minigame-wordle" class="mini-game hidden">
        <div class="wordle-container">
          <p id="wordle-hint">Guess the 5-letter word!</p>
          <div id="wordle-feedback">
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
            <div class="wordle-row"><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div><div class="wordle-cell"></div></div>
          </div>
          <input type="text" id="wordle-input" placeholder="Enter a 5-letter word" maxlength="5">
          <button id="wordle-submit" class="btn-primary">Guess</button>
          <p id="wordle-status"></p>
        </div>
      </div>

      <!-- Geography Mini Game -->
      <div id="minigame-geography" class="mini-game hidden">
        <div class="geography-container">
          <h3 id="geography-category">Name countries in...</h3>
          <p id="geography-progress"></p>
          <input type="text" id="geography-input" placeholder="Enter a country or capital">
          <button id="geography-submit" class="btn-primary">Submit</button>
          <p id="geography-feedback"></p>
        </div>
      </div>

      <!-- Word Scramble Mini Game -->
      <div id="minigame-wordscramble" class="mini-game hidden">
        <div class="wordscramble-container">
          <p class="scrambled-word" id="scrambled-word"></p>
          <input type="text" id="wordscramble-input" placeholder="Unscramble the word">
          <button id="wordscramble-submit" class="btn-primary">Submit</button>
          <p id="wordscramble-status"></p>
        </div>
      </div>

      <!-- Dots & Boxes Mini Game -->
      <div id="minigame-dotsboxes" class="mini-game hidden">
        <div class="dotsboxes-container">
          <div id="dotsboxes-grid" class="dots-grid"></div>
          <p id="dotsboxes-status"></p>
        </div>
      </div>

      <!-- Connect Four Mini Game -->
      <div id="minigame-connect4" class="mini-game hidden">
        <div class="connect4-container">
          <div id="connect4-board" class="connect4-board"></div>
          <div class="connect4-controls">
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(0)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(1)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(2)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(3)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(4)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(5)">↓</button>
            <button class="drop-btn" type="button" onclick="window.dropPieceC4(6)">↓</button>
          </div>
        </div>
      </div>

      <!-- Math Mini Game -->
      <div id="minigame-math" class="mini-game hidden">
        <div class="math-container">
          <p class="math-question" id="math-question"></p>
          <input type="number" id="math-input" placeholder="Enter your answer">
          <button id="math-submit" class="btn-primary">Submit</button>
          <p id="math-status"></p>
        </div>
      </div>

      <!-- Trivia Mini Game -->
      <div id="minigame-trivia" class="mini-game hidden">
        <div class="trivia-container">
          <p class="trivia-question" id="trivia-question"></p>
          <div class="trivia-options" id="trivia-options"></div>
          <p id="trivia-status"></p>
        </div>
      </div>

      <!-- Spelling Bee Mini Game -->
      <div id="minigame-spellingbee" class="mini-game hidden">
        <div class="spellingbee-container">
          <p id="spellingbee-word"></p>
          <input type="text" id="spellingbee-input" placeholder="Spell the word">
          <button id="spellingbee-submit" class="btn-primary">Submit</button>
          <p id="spellingbee-status"></p>
        </div>
      </div>

      <!-- Higher or Lower Mini Game -->
      <div id="minigame-higherlow" class="mini-game hidden">
        <div class="higherlow-container">
          <p id="higherlow-current">Current: ?</p>
          <p id="higherlow-status"></p>
        </div>
      </div>

      <!-- Guess Number Mini Game -->
      <div id="minigame-guessnumber" class="mini-game hidden">
        <div class="guessnumber-container">
          <p>I'm thinking of a number from 1-10...</p>
          <input type="number" id="guessnumber-input" placeholder="Guess a number" min="1" max="10">
          <button id="guessnumber-submit" class="btn-primary">Guess</button>
          <p id="guessnumber-status"></p>
        </div>
      </div>

      <!-- Coin Flip Mini Game -->
      <div id="minigame-coinflip" class="mini-game hidden">
        <div class="coinflip-container">
          <div id="coin-display" style="font-size: 4em; text-align: center; margin: 2em; cursor: pointer;">🪙</div>
          <div class="coinflip-buttons">
            <button class="btn-primary" onclick="window.callCoinFlip('heads')">Heads</button>
            <button class="btn-primary" onclick="window.callCoinFlip('tails')">Tails</button>
          </div>
          <p id="coinflip-status"></p>
        </div>
      </div>

      <!-- Boggle Mini Game -->
      <div id="minigame-boggle" class="mini-game hidden">
        <div class="boggle-container">
          <p id="boggle-board"></p>
          <input type="text" id="boggle-input" placeholder="Type words...">
          <button id="boggle-submit" class="btn-primary">Submit Word</button>
          <p id="boggle-status"></p>
          <p id="boggle-words">Words found: </p>
        </div>
      </div>

      <!-- Anagrams Mini Game -->
      <div id="minigame-anagrams" class="mini-game hidden">
        <div class="anagrams-container">
          <p id="anagrams-letters"></p>
          <input type="text" id="anagrams-input" placeholder="Enter a word">
          <button id="anagrams-submit" class="btn-primary">Submit</button>
          <p id="anagrams-status"></p>
          <p id="anagrams-found">Words: 0/3</p>
        </div>
      </div>

      <!-- Filler Mini Game -->
      <div id="minigame-filler" class="mini-game hidden">
        <div class="filler-container">
          <div id="filler-board" class="filler-board"></div>
          <p id="filler-status"></p>
          <div class="filler-colors" id="filler-colors"></div>
        </div>
      </div>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen" class="screen hidden">
      <div class="settings-content">
        <h2>Settings</h2>
        <p>Settings coming soon...</p>
        <button id="back-from-settings" class="btn-secondary btn-large">Back to Game</button>
      </div>
    </div>

    <!-- App Alert Overlay -->
    <div id="app-alert" class="app-alert hidden" aria-live="polite"></div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
      <div class="gameover-content">
        <h2 id="gameover-title">Game Over!</h2>
        <div class="gameover-stats">
          <p id="gameover-winner"></p>
          <div class="final-scores">
            <div class="score-item">
              <span id="final-x-name">X</span>: <span id="final-x-score">0</span>
            </div>
            <div class="score-item">
              <span id="final-o-name">O</span>: <span id="final-o-score">0</span>
            </div>
          </div>
        </div>
        <div class="gameover-buttons">
          <button id="play-again-btn" class="btn-primary btn-large">Play Again</button>
          <button id="main-menu-btn" class="btn-secondary btn-large">Main Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
